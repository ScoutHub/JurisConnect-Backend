services:
  legifrance-db:
    container_name: legifrance-db
    image: postgres:17.2-alpine
    ports:
      - "19001:5432"
    volumes:
      - ./legifrance.sql:/docker-entrypoint-initdb.d/legifrance.sql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legifrance"]
      interval: 10s
      timeout: 5s
      retries: 5

  legifrance-manager:
    container_name: legifrance-manager
    image: adminer:4.8.1
    ports:
      - "8080:8080"
    depends_on:
      - legifrance-db
    environment:
      ADMINER_DESIGN: dracula

  # legifrance-scripts:
  #   container_name: legifrance-scripts
  #   build:
  #     context: ../
  #     dockerfile: scripts/Dockerfile
  #   depends_on:
  #     legifrance-db:
  #       condition: service_healthy
  #   volumes:
  #     - ./legifrance.sql:/legifrance.sql
  #   env_file:
  #     - .env

  legifrance-api:
    container_name: legifrance-api
    build:
      context: ../
      dockerfile: backend/Dockerfile.${ENV:-dev}
    ports:
      - "8000:8000"
    depends_on:
      - legifrance-db
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
